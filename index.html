<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Escola Bressol Petits Giraffes (Bruc) - Diari</title>
    <meta
      name="description"
      content="El menú, les activitats i els materials indicats per l’escola. Diari no oficial per a famílies."
    />
    <link rel="icon" href="./favicon.png" />
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#FFF9F0" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Giraffes Bruc" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./characters.css" />
    <link
      rel="preload"
      href="./assets/nunito-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script defer src="./assets/lucide.min.js"></script>
    <script defer src="./data.js"></script>
    <script defer src="./characters.js"></script>
    <script defer src="./script.js"></script>
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script>
      if (!["localhost", "127.0.0.1", "[::1]"].includes(location.hostname)) {
        const analytics = document.createElement("script");
        analytics.defer = true;
        analytics.src = "/_vercel/insights/script.js";
        document.head.appendChild(analytics);
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#diary">Salta al diari</a>
    <header class="site-header shell">
      <a class="brand" href="./"
        ><span class="brand-kicker">Escola Bressol Petits</span
        ><span class="brand-name">Giraffes Bruc</span></a
      >
      <div class="header-actions">
        <button
          class="icon-button"
          id="motion-btn"
          aria-label="Atura les animacions"
          aria-pressed="false"
        >
          <i data-lucide="pause"></i></button
        ><span class="course" id="course-label"></span
        ><button class="icon-button" id="theme-btn" aria-label="Canvia el tema">
          <i data-lucide="sun-moon"></i>
        </button>
      </div>
    </header>
    <main class="shell">
      <div
        id="connection-status"
        class="connection-status"
        role="status"
        hidden
      ></div>
      <div class="workspace">
        <section
          id="diary"
          class="diary"
          aria-label="Diari de l'escola"
          tabindex="-1"
        >
          <div class="toolbar">
            <div class="view-switch" role="group" aria-label="Vista del diari">
              <button id="daily-btn" aria-pressed="true">Diari</button
              ><button id="weekly-btn" aria-pressed="false">Setmana</button>
            </div>
            <div class="date-tools">
              <button id="today-btn" class="text-button">Avui</button
              ><button
                id="calendar-toggle-btn"
                class="icon-button"
                aria-label="Obre el calendari"
                aria-haspopup="dialog"
              >
                <i data-lucide="calendar-days"></i>
              </button>
            </div>
          </div>
          <div class="date-heading">
            <div>
              <p class="date-context" id="date-context"></p>
              <h1 id="date-title">Carregant el diari…</h1>
            </div>
            <div class="day-arrows">
              <button
                id="prev-day-btn"
                class="icon-button"
                aria-label="Dia anterior"
              >
                <i data-lucide="arrow-left"></i></button
              ><button
                id="next-day-btn"
                class="icon-button"
                aria-label="Dia següent"
              >
                <i data-lucide="arrow-right"></i>
              </button>
            </div>
          </div>
          <div
            id="week-strip"
            class="week-strip"
            aria-label="Dies de la setmana"
          ></div>
          <div id="schedule-status"></div>
          <div id="main-container" aria-busy="true">
            <div class="skeleton" aria-label="Carregant">
              <div></div>
              <div></div>
            </div>
          </div>
          <div class="diary-footer">
            <span id="data-range"></span
            ><button class="text-button" id="share-btn">
              <i data-lucide="link"></i>Copia el dia
            </button>
          </div>
        </section>
        <aside class="preparation" aria-labelledby="bag-title">
          <section id="bag-panel" class="bag-panel">
            <div class="bag-heading">
              <span class="bag-icon"><i data-lucide="backpack"></i></span>
              <h2 id="bag-title" class="aside-title">La motxilla</h2>
              <span id="bag-count" hidden></span>
            </div>
            <div class="bag-body" id="bag-content" hidden>
              <div id="checklist"></div>
              <div class="checklist-bottom">
                <span id="checklist-progress" role="status"></span
                ><button class="text-button" id="reset-list">Desmarca</button>
              </div>
              <p
                id="storage-warning"
                class="inline-error"
                role="status"
                hidden
              ></p>
            </div>
          </section>
        </aside>
      </div>
    </main>
    <footer class="site-footer shell">
      <span>🥸 no oficial - pot contenir errors</span>
    </footer>
    <dialog id="calendar-dialog" aria-labelledby="calendar-title">
      <div class="dialog-heading">
        <h2 id="calendar-title">Calendari</h2>
        <button
          class="icon-button"
          id="close-calendar"
          aria-label="Tanca el calendari"
        >
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="calendar-nav">
        <button class="icon-button" id="prev-month" aria-label="Mes anterior">
          <i data-lucide="chevron-left"></i>
        </button>
        <h3 id="calendar-month"></h3>
        <button class="icon-button" id="next-month" aria-label="Mes següent">
          <i data-lucide="chevron-right"></i>
        </button>
      </div>
      <div class="calendar-weekdays" aria-hidden="true">
        <span>dl</span><span>dt</span><span>dc</span><span>dj</span
        ><span>dv</span><span>ds</span><span>dg</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
      <p class="calendar-legend">
        <span><b class="school-marker"></b>Amb programació</span
        ><span><b class="holiday-marker"></b>Festiu</span>
      </p>
      <div class="calendar-bottom">
        <button class="text-button" id="calendar-today">Ves a avui</button
        ><button class="text-button" id="last-published">
          Últim dia publicat
        </button>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
    <noscript
      ><p class="shell">
        Activa JavaScript per consultar el diari. També pots
        <a href="./calendar.csv">descarregar les dades del calendari</a>.
      </p></noscript
    >
  </body>
</html>
